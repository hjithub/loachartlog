<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>가격 변동 아이템</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: #e0e0e0; padding: 16px; max-width: 720px; margin: 0 auto; }
    h1 { color: #e8b445; margin-bottom: 4px; font-size: 1.5em; }
    .subtitle { color: #888; font-size: 0.8em; margin-bottom: 16px; }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; flex-wrap: wrap; gap: 8px; }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .updated { color: #888; font-size: 0.8em; }
    .refresh-btn {
      background: #16213e; border: 1px solid #e8b445; color: #e8b445;
      padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 0.85em;
    }
    .refresh-btn:hover { background: #e8b445; color: #1a1a2e; }
    .refresh-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    table { width: 100%; border-collapse: collapse; background: #16213e; border-radius: 10px; overflow: hidden; }
    th { text-align: left; color: #e8b445; padding: 8px; font-size: 0.8em; border-bottom: 1px solid #2a2a4a; }
    td { padding: 10px 8px; font-size: 0.9em; border-bottom: 1px solid #1a1a2e; }
    tr:hover td { background: #0f3460; }
    .rank { color: #888; width: 2em; }
    .item-cell { display: flex; align-items: center; gap: 8px; }
    .item-icon { width: 28px; height: 28px; border-radius: 4px; background: #0f3460; flex-shrink: 0; }
    .item-name { white-space: nowrap; }
    .grade-고대 { color: #dba64b; }
    .grade-유물 { color: #d2523d; }
    .grade-전설 { color: #e8b445; }
    .grade-영웅 { color: #b06fd6; }
    .price { color: #ccc; white-space: nowrap; }
    .pct-up { color: #4ecca3; font-weight: bold; white-space: nowrap; }
    .pct-down { color: #e05c5c; font-weight: bold; white-space: nowrap; }
    .pct-flat { color: #999; font-weight: bold; white-space: nowrap; }
    .trade-count { color: #e0e0e0; text-align: right; white-space: nowrap; }
    .trade-count .unit { color: #888; font-size: 0.8em; }
    .no-results { color: #666; font-style: italic; padding: 12px 0; text-align: center; }
    .loading { text-align: center; color: #888; padding: 40px 0; }
    .plain-section { margin-bottom: 20px; }
    .plain-title { color: #888; font-size: 0.8em; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.03em; }
    .plain-table { width: 100%; border-collapse: collapse; background: #16213e; border-radius: 10px; overflow: hidden; }
    .plain-table td { padding: 6px 8px; font-size: 0.85em; border-bottom: 1px solid #1a1a2e; color: #ccc; }
    .plain-table .rank { color: #666; width: 2em; }
    .plain-table .name { white-space: nowrap; }
    .plain-table .count { text-align: right; white-space: nowrap; color: #e0e0e0; }
    .plain-table .count .unit { color: #666; font-size: 0.8em; }
    @media (max-width: 600px) {
      .hide-mobile { display: none; }
      td, th { padding: 6px 4px; font-size: 0.82em; }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <h1>가격 변동 아이템</h1>
      <span class="updated" id="updated"></span>
    </div>
    <button class="refresh-btn" id="refreshBtn" onclick="loadData()" title="Reload cached data">&#x21bb; Refresh</button>
  </div>
  <div class="subtitle">전일 대비 등락률 상위 종목 &middot; 거래 건수 순 정렬</div>

  <div id="content"><div class="loading">Loading...</div></div>

  <script>
    function formatGold(n) {
      if (n == null) return '-';
      return Math.round(n).toLocaleString() + 'g';
    }

    function timeAgo(isoStr) {
      const diff = Date.now() - new Date(isoStr).getTime();
      const mins = Math.floor(diff / 60000);
      if (mins < 1) return '방금';
      if (mins < 60) return mins + '분 전';
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return hrs + '시간 전';
      return Math.floor(hrs / 24) + '일 전';
    }

    function renderRow(item, rank) {
      const gradeClass = 'grade-' + (item.grade || '');
      const icon = item.icon
        ? `<img class="item-icon" src="${item.icon}" alt="">`
        : '<span class="item-icon"></span>';
      const tradeCount = item.tradeCount != null
        ? `${item.tradeCount.toLocaleString()}<span class="unit">건</span>`
        : '<span class="unit">-</span>';
      const pctClass = item.pctChange > 0 ? 'pct-up' : item.pctChange < 0 ? 'pct-down' : 'pct-flat';
      const pctSign = item.pctChange > 0 ? '+' : '';

      return `<tr>
        <td class="rank">${rank}</td>
        <td><div class="item-cell">${icon}<span class="item-name ${gradeClass}">${item.name}</span></div></td>
        <td class="price hide-mobile">${formatGold(item.yDayAvgPrice)}</td>
        <td class="price">${formatGold(item.currentPrice)}</td>
        <td class="${pctClass}">${pctSign}${item.pctChange}%</td>
        <td class="trade-count">${tradeCount}</td>
      </tr>`;
    }

    function renderTradeVolumeTop10(items) {
      // Plain, unstyled ranking by trade count alone - no % change, no color.
      // items[] is already sorted by tradeCount descending, so this is just the head.
      const top10 = items.slice(0, 10);
      let html = '<div class="plain-section">';
      html += '<div class="plain-title">거래량 TOP 10</div>';
      html += '<table class="plain-table"><tbody>';
      top10.forEach((item, i) => {
        const count = item.tradeCount != null
          ? `${item.tradeCount.toLocaleString()}<span class="unit">건</span>`
          : '-';
        html += `<tr>
          <td class="rank">${i + 1}</td>
          <td class="name">${item.name}</td>
          <td class="count">${count}</td>
        </tr>`;
      });
      html += '</tbody></table></div>';
      return html;
    }

    async function loadData() {
      const btn = document.getElementById('refreshBtn');
      btn.disabled = true;
      btn.textContent = '...';

      try {
        const res = await fetch('movers.json?t=' + Date.now());
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();

        document.getElementById('updated').textContent = timeAgo(data.updated_at);
        document.getElementById('updated').title = data.updated_at;

        const items = data.items || [];
        if (items.length === 0) {
          document.getElementById('content').innerHTML = '<div class="no-results">데이터 없음</div>';
          return;
        }

        let html = renderTradeVolumeTop10(items);
        html += '<table><thead><tr>';
        html += '<th></th><th>아이템</th><th class="hide-mobile">어제 평균가</th><th>현재가</th><th>등락률</th><th>거래 건수</th>';
        html += '</tr></thead><tbody>';
        items.forEach((item, i) => { html += renderRow(item, i + 1); });
        html += '</tbody></table>';

        document.getElementById('content').innerHTML = html;
      } catch (e) {
        document.getElementById('content').innerHTML =
          `<div class="no-results">Error: ${e.message}</div>`;
      } finally {
        btn.disabled = false;
        btn.textContent = '↻ Refresh';
      }
    }

    loadData();
  </script>
</body>
</html>
